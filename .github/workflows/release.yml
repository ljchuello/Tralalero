name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Publish Windows release
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 🧪 Test
        run: dotnet test Tralalero.slnx -c Release

      - name: 📦 Publish self-contained ZIP
        shell: pwsh
        run: ./scripts/publish.ps1 -Version "${{ github.ref_name }}"

      - name: 📤 Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            ## 🎙️ Tralalero ${{ github.ref_name }}

            Near-live dictation for Windows, powered by OpenAI.

            Download the ZIP, extract it, run `Tralalero.exe`, and add your OpenAI API key.
            Your key is encrypted with Windows DPAPI.
